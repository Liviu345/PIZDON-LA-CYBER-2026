<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Ieșirea cu Pațanii 🎮</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black;
    color:white;
    text-align:center;
}

#loading{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    color:#00ff00;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2em;
    z-index:9999;
}

.container{
    display:none;
    padding:20px;
}

h1{
    font-size:4em;
    animation:bounce 1s infinite;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:20px;
    max-width:800px;
    margin:auto;
    backdrop-filter:blur(10px);
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.pc{
    font-size:80px;
    display:inline-block;
    animation:spin 4s linear infinite;
}

#runaway{
    position:absolute;
    padding:15px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

#countdown{
    font-size:28px;
    margin:20px;
}
</style>
</head>

<body>

<div id="loading">
⚠ ACCES RESTRICȚIONAT ⚠<br>
Inițializare sistem...
</div>

<div class="container" id="main">

<div class="card">

<h1>🎮 IEȘIREA CU PAȚANII 🎮</h1>

<div class="pc">🖥️</div>

<h2>📅 13.06.2026</h2>
<h2>🕚 11:00</h2>
<h2>📍 Cyber</h2>

<p><b>Motiv:</b> Gaming turbat la PC până ne căcăm pe noi de râs.</p>

<p><b>Perioada:</b> POHUI</p>

<p><b>After-Party:</b> 🌯 Kebab pizdos 🌯</p>

<div id="countdown"></div>

<br>

<button onclick="acceptInvite()">
✅ VIN
</button>

<button id="runaway">
❌ NU VIN
</button>

</div>

</div>

<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>

setTimeout(()=>{
document.getElementById("loading").style.display="none";
document.getElementById("main").style.display="block";
},3000);

function acceptInvite(){
alert("🎉 CONFIRMARE ACCEPTATĂ 🎉\n\n+100 Respect\n+50 Skill la CS\n+25 Rezistență la kebab");
}

const btn=document.getElementById("runaway");

btn.addEventListener("mouseover",()=>{
btn.style.left=Math.random()*(window.innerWidth-150)+"px";
btn.style.top=Math.random()*(window.innerHeight-80)+"px";
});

const target=new Date("June 13, 2026 11:00:00").getTime();

setInterval(()=>{

const now=new Date().getTime();
const diff=target-now;

const d=Math.floor(diff/(1000*60*60*24));
const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((diff%(1000*60*60))/(1000*60));
const s=Math.floor((diff%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
"⏳ Mai sunt: "+d+" zile "+h+" ore "+m+" minute "+s+" secunde";

},1000);

setInterval(()=>{

const e=document.createElement("div");

const emojis=["🎉","😂","🎮","🌯","🍕","🔥"];

e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

e.style.position="absolute";
e.style.left=Math.random()*window.innerWidth+"px";
e.style.top="-50px";
e.style.fontSize="40px";

document.body.appendChild(e);

let pos=-50;

const fall=setInterval(()=>{

pos+=5;
e.style.top=pos+"px";

if(pos>window.innerHeight){
clearInterval(fall);
e.remove();
}

},20);

},250);

</script>

</body>
</html>
